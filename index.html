<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>同步雙迷宮</title>
<style>
:root{
  --bg:#141a2e; --panel:#1f2742; --panel2:#2a3458; --ink:#eef1ff; --mute:#9aa3c7;
  --tileL:#2fb8a6; --tileL2:#249384; --tileR:#7d7ff2; --tileR2:#5f61c9;
  --wall:#ffc53d; --ball:#ffffff; --accent:#ffc53d; --bad:#ff6b6b; --ok:#5fe08a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:var(--ink);background:var(--panel2);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap}
button:hover{filter:brightness(1.15)}
button:active{transform:translateY(1px)}
button.pri{background:var(--accent);color:#2a2000;font-weight:700}
button.danger{background:#5a2b3a}
button:disabled{opacity:.4;cursor:default}
.screen{display:none;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.bar .sp{flex:1}
.title{font-size:20px;font-weight:700;letter-spacing:.05em}
.sub{color:var(--mute);font-size:14px}
.stage{flex:1;min-height:0;position:relative;touch-action:none;user-select:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
/* select */
#selMain{flex:1;min-height:0;display:flex;align-items:stretch}
.nav{width:56px;font-size:26px;background:none;color:var(--mute);border-radius:0}
#selInfo{text-align:center;padding:4px 12px}
#selName{font-size:22px;font-weight:700}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:thin}
.chip{flex:none;min-width:40px;padding:6px 10px;border-radius:8px;background:var(--panel);font-size:14px;position:relative}
.chip.cur{outline:2px solid var(--accent)}
.chip.done{background:#24553f}
.chip.custom{background:#3a2f5c}
.chip.custom.done{background:#24553f}
/* play */
#pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,42px);gap:4px}
#pad button{padding:0;font-size:18px}
#playBtns{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.ball{transition:transform .13s ease-out}
.ball.nt{transition:none}
.ball circle{transition:transform .35s ease-in,opacity .35s ease-in;transform-box:fill-box;transform-origin:center}
.ball.fall circle{transform:scale(0);opacity:0}
.goalring{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(.82)}}
#overlay{position:fixed;inset:0;background:rgba(10,13,26,.72);display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
#overlay.on{display:flex}
#ovBox{background:var(--panel);border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center}
#ovTitle{font-size:24px;font-weight:700;margin-bottom:6px}
#ovMsg{color:var(--mute);margin-bottom:16px;line-height:1.6}
#ovBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1}
/* editor */
#edBody{flex:1;min-height:0;display:flex;gap:10px;padding:0 10px;overflow:auto}
.edSide{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);border-radius:12px;padding:8px}
.edCtl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{padding:2px 10px}
.stepper b{width:1.2em;text-align:center}
.edSvg{flex:1;min-height:180px;position:relative;touch-action:none;user-select:none}
.edSvg svg{position:absolute;inset:0;width:100%;height:100%}
#tools{display:flex;gap:6px;flex-wrap:wrap}
#tools button.sel{background:var(--accent);color:#2a2000;font-weight:700}
#edName{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid #445;background:#0f1424;color:var(--ink);min-width:90px;flex:1}
#edStatus{padding:6px 12px;font-size:14px}
.okc{color:var(--ok)} .badc{color:var(--bad)}
@media (orientation:portrait){ #edBody{flex-direction:column} .edSvg{min-height:230px} }
</style>
</head>
<body>

<!-- 選關 -->
<div id="select" class="screen">
  <div class="bar">
    <span class="title">同步雙迷宮</span><span class="sp"></span>
    <button id="btnNew">＋ 新關卡</button>
    <button id="btnImport">匯入</button>
    <button id="btnHelp">玩法</button>
  </div>
  <div id="selInfo"><div id="selName"></div><div id="selSub" class="sub"></div></div>
  <div id="selMain">
    <button class="nav" id="btnPrev" aria-label="上一關">◀</button>
    <div class="stage" id="selStage"><svg id="selSvg"></svg></div>
    <button class="nav" id="btnNext" aria-label="下一關">▶</button>
  </div>
  <div class="bar" style="justify-content:center">
    <button class="pri" id="btnPlay">開始</button>
    <button id="btnReplay">回播我的解法</button>
    <button id="btnEdit">編輯</button>
    <button id="btnExport">匯出</button>
    <button class="danger" id="btnDel">刪除</button>
  </div>
  <div id="chips"></div>
</div>

<!-- 遊玩 -->
<div id="play" class="screen">
  <div class="bar">
    <button id="btnBack">← 選關</button>
    <span class="title" id="plName" style="font-size:17px"></span><span class="sp"></span>
    <span class="sub" id="plSteps"></span>
  </div>
  <div class="stage" id="plStage"><svg id="plSvg"></svg></div>
  <div class="bar">
    <div id="playBtns">
      <button id="btnUndo">↶ 退回</button>
      <button id="btnRestart">⟲ 重來</button>
      <button id="btnHint">提示</button>
      <button id="btnSolve">自動求解</button>
      <button id="btnStop" class="pri" style="display:none">■ 停止</button>
    </div>
    <div id="pad">
      <span></span><button data-d="U">▲</button><span></span>
      <button data-d="L">◀</button><button data-d="D">▼</button><button data-d="R">▶</button>
    </div>
  </div>
</div>

<!-- 編輯器 -->
<div id="editor" class="screen">
  <div class="bar">
    <button id="edBack">← 返回</button>
    <input id="edName" maxlength="20" placeholder="關卡名稱">
    <button id="edTest">試玩</button>
    <button class="pri" id="edSave">儲存</button>
  </div>
  <div class="bar" style="padding-top:0">
    <div id="tools">
      <button data-t="floor">地板</button>
      <button data-t="wall">牆</button>
      <button data-t="start">球</button>
      <button data-t="goal">終點</button>
    </div>
    <span class="sub" id="edTip"></span>
  </div>
  <div id="edBody">
    <div class="edSide" data-side="L">
      <div class="edCtl">左圖
        <span class="stepper">寬 <button data-k="w" data-v="-1">−</button><b data-o="w"></b><button data-k="w" data-v="1">＋</button></span>
        <span class="stepper">高 <button data-k="h" data-v="-1">−</button><b data-o="h"></b><button data-k="h" data-v="1">＋</button></span>
      </div>
      <div class="edSvg"><svg></svg></div>
    </div>
    <div class="edSide" data-side="R">
      <div class="edCtl">右圖
        <span class="stepper">寬 <button data-k="w" data-v="-1">−</button><b data-o="w"></b><button data-k="w" data-v="1">＋</button></span>
        <span class="stepper">高 <button data-k="h" data-v="-1">−</button><b data-o="h"></b><button data-k="h" data-v="1">＋</button></span>
      </div>
      <div class="edSvg"><svg></svg></div>
    </div>
  </div>
  <div id="edStatus"></div>
</div>

<div id="overlay"><div id="ovBox"><div id="ovTitle"></div><div id="ovMsg"></div><div id="ovBtns"></div></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- 追蹤（僅 github.io） ---------- */
const GOATCOUNTER = 'digitalgenius';
if (location.hostname.endsWith('github.io')) {
  const sc = document.createElement('script');
  sc.async = true;
  sc.src = 'https://gc.zgo.at/count.js';
  sc.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  document.head.appendChild(sc);
}

/* ---------- 內建關卡 ----------
   rows: '#' 地板 '.' 空洞；hw "x,y" = 格 (x,y) 上緣的橫牆；vw "x,y" = 格 (x,y) 左緣的直牆；s 球；g 終點 */
const BUILTIN = [{"L":{"w":4,"h":4,"rows":["####","####","##.#",".##."],"hw":["1,3","3,0"],"vw":["1,0","1,1","2,0"],"s":[3,1],"g":[1,1]},"R":{"w":4,"h":4,"rows":[".##.","####",".###","####"],"hw":["1,3","2,1","2,3"],"vw":["2,2"],"s":[2,2],"g":[3,2]}},{"L":{"w":4,"h":4,"rows":["##..","####","####","##.#"],"hw":["0,1","0,2","0,3","2,3","3,4"],"vw":["0,0","2,2"],"s":[1,3],"g":[1,2]},"R":{"w":4,"h":4,"rows":[".#.#",".###","####","####"],"hw":["0,4","1,1","2,2","3,1"],"vw":["2,1"],"s":[1,1],"g":[0,3]}},{"L":{"w":5,"h":4,"rows":["..#..","#.###","#####","..###"],"hw":["2,2"],"vw":["1,2","3,1","3,3","5,2"],"s":[1,2],"g":[2,3]},"R":{"w":4,"h":5,"rows":["##..","####","####","####","#..."],"hw":["0,4","1,1","2,4"],"vw":["0,0","1,3","4,2"],"s":[0,1],"g":[2,1]}},{"L":{"w":5,"h":5,"rows":[".##..","#####","#####","#####","####."],"hw":["0,3","2,3","4,1"],"vw":["0,3","1,4","3,4","4,1","4,2"],"s":[3,4],"g":[0,2]},"R":{"w":5,"h":5,"rows":["####.","#####","####.","#####",".##.."],"hw":["1,1","1,2"],"vw":["3,2"],"s":[2,2],"g":[1,0]}},{"L":{"w":5,"h":5,"rows":["#####",".####",".####",".####",".####"],"hw":["2,2"],"vw":["1,4","2,1","2,2","3,1","4,3"],"s":[3,2],"g":[3,0]},"R":{"w":4,"h":6,"rows":[".##.",".###",".##.","###.","####","####"],"hw":["0,3","1,1"],"vw":["0,4"],"s":[2,1],"g":[1,4]}},{"L":{"w":6,"h":5,"rows":["..##..",".#####","######","#####.","#####."],"hw":["1,5","2,1","2,4","3,3"],"vw":["1,1","1,4"],"s":[1,3],"g":[1,4]},"R":{"w":5,"h":6,"rows":["##...","####.","##.#.","#####","#####","#####"],"hw":["0,0","1,5","2,1","3,1","4,5"],"vw":["1,3"],"s":[3,3],"g":[3,2]}},{"L":{"w":6,"h":6,"rows":[".#####","######","######",".#####","######",".#.#.."],"hw":[],"vw":["1,5","2,5","3,4","4,2"],"s":[4,1],"g":[2,0]},"R":{"w":6,"h":6,"rows":["..####","######",".#####",".####.","######","..####"],"hw":["0,5","1,1","3,4","5,2"],"vw":["0,4","2,0","3,4","6,2"],"s":[3,0],"g":[2,3]}},{"L":{"w":6,"h":6,"rows":["####..","######","#####.","#####.",".####.","...##."],"hw":["0,1","2,2"],"vw":["5,4","6,1"],"s":[3,0],"g":[1,0]},"R":{"w":5,"h":7,"rows":["#####","####.","####.","#.###","#####",".####","...##"],"hw":["2,2","2,6","4,0"],"vw":["1,0","1,3","3,0"],"s":[3,0],"g":[0,3]}},{"L":{"w":7,"h":6,"rows":[".######","#######",".######","#######","#..####",".....##"],"hw":["2,1","2,3","4,0"],"vw":["1,2","2,2","7,3"],"s":[6,4],"g":[0,1]},"R":{"w":6,"h":6,"rows":["######","######","######","...###","..####","..####"],"hw":["1,1","2,1"],"vw":["0,0","3,4"],"s":[0,2],"g":[3,3]}},{"L":{"w":7,"h":7,"rows":["...#.##","..#####","...####","..#####","..#####","#######",".#####."],"hw":["3,2","3,4","5,5","6,5"],"vw":["6,3"],"s":[4,1],"g":[1,6]},"R":{"w":7,"h":7,"rows":[".####..",".###...","####...","#####..","#######","#######","#######"],"hw":["4,1"],"vw":["2,0","5,4"],"s":[0,4],"g":[6,5]}},{"L":{"w":7,"h":6,"rows":["#####..","#######","###.###","#######","..###..","...#..."],"hw":["5,4"],"vw":["2,2","5,2"],"s":[2,3],"g":[4,1]},"R":{"w":7,"h":7,"rows":["...###.","...###.","..#####","#######","#######","#######","#######"],"hw":["0,6","4,7","5,3","5,4"],"vw":["2,6","3,3","3,6","6,1","6,5"],"s":[5,2],"g":[6,6]}},{"L":{"w":7,"h":7,"rows":["##.####","#######","#######","#######",".###...",".####..","..#...."],"hw":[],"vw":["0,0","1,0","1,4","3,2","7,1"],"s":[6,0],"g":[3,4]},"R":{"w":7,"h":7,"rows":["#######","######.","####...","######.","######.","#####..","####..."],"hw":["3,7","5,0","5,5"],"vw":[],"s":[0,0],"g":[2,3]}},{"L":{"w":7,"h":7,"rows":["###..##",".######","#.#####","#######","#######",".##.###","....###"],"hw":["0,3","4,4","5,0","6,5"],"vw":["0,4","5,3","6,4"],"s":[6,4],"g":[2,0]},"R":{"w":6,"h":7,"rows":["...###","#.####","######","######","######","..####",".#####"],"hw":["5,6"],"vw":["3,1","5,1"],"s":[4,1],"g":[5,3]}},{"L":{"w":7,"h":7,"rows":["..#####","...####","..#####","#.#####","#######",".######",".#.####"],"hw":["2,0","2,4","2,5","2,6","3,1","3,7","4,3","5,2","5,3","6,2"],"vw":["0,4","5,6","6,0"],"s":[2,0],"g":[3,0]},"R":{"w":7,"h":7,"rows":["#######","#######","######.","######.","###..#.",".##....",".#....."],"hw":["2,0"],"vw":["0,3","0,4","2,6"],"s":[3,1],"g":[5,4]}},{"L":{"w":7,"h":7,"rows":["######.","#######","######.","######.","##.###.","#......","#......"],"hw":["0,3","0,6","2,4","3,4"],"vw":["0,0","1,2","1,5","2,3","2,4"],"s":[5,1],"g":[4,4]},"R":{"w":7,"h":7,"rows":["#####.#","#######","#######","#####..","####...","##.....",".#....."],"hw":["1,6","3,0"],"vw":["0,4","1,5","2,6","4,3"],"s":[1,1],"g":[3,2]}}];
BUILTIN.forEach((lv, i) => { lv.id = 'b' + (i + 1); lv.name = '第 ' + (i + 1) + ' 關'; });

/* ---------- 儲存 ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('tm_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tm_' + k, JSON.stringify(v)); } catch (e) {} }
};
let customs = store.get('custom', []);
let recs = store.get('rec', {});     // id -> {best, last}
let progs = store.get('prog', {});   // id -> moves（未過關的進度）
const allLevels = () => BUILTIN.concat(customs);

/* ---------- 規則與求解 ---------- */
const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
const DNAME = { U: '上 ▲', D: '下 ▼', L: '左 ◀', R: '右 ▶' };
function prep(b) { return { w: b.w, h: b.h, rows: b.rows, s: b.s, g: b.g, H: new Set(b.hw), V: new Set(b.vw) }; }
const isFloor = (b, x, y) => x >= 0 && y >= 0 && x < b.w && y < b.h && b.rows[y][x] === '#';
function blocked(b, x, y, d) {
  return d === 'U' ? b.H.has(x + ',' + y) : d === 'D' ? b.H.has(x + ',' + (y + 1))
    : d === 'L' ? b.V.has(x + ',' + y) : b.V.has((x + 1) + ',' + y);
}
// 回傳 {x,y,fell}
function step(b, x, y, d) {
  if (blocked(b, x, y, d)) return { x, y, fell: false };
  const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
  return { x: nx, y: ny, fell: !isFloor(b, nx, ny) };
}
function solve(L, R, pos) {
  const st0 = pos || [L.s[0], L.s[1], R.s[0], R.s[1]];
  const key = s => s[0] + s[1] * 8 + s[2] * 64 + s[3] * 512;
  const prev = new Map([[key(st0), null]]);
  let q = [st0];
  const isGoal = s => s[0] === L.g[0] && s[1] === L.g[1] && s[2] === R.g[0] && s[3] === R.g[1];
  while (q.length) {
    const nq = [];
    for (const s of q) {
      if (isGoal(s)) {
        let out = '', k = key(s);
        for (let p = prev.get(k); p; p = prev.get(p[0])) out = p[1] + out;
        return out;
      }
      for (const d of 'UDLR') {
        const a = step(L, s[0], s[1], d), b = step(R, s[2], s[3], d);
        if (a.fell || b.fell) continue;
        const ns = [a.x, a.y, b.x, b.y], k = key(ns);
        if (prev.has(k)) continue;
        prev.set(k, [key(s), d]); nq.push(ns);
      }
    }
    q = nq;
  }
  return null;
}
// 依序套用 moves，回傳最後位置；若中途掉落回傳 null
function simulate(L, R, moves) {
  let p = [L.s[0], L.s[1], R.s[0], R.s[1]];
  for (const d of moves) {
    const a = step(L, p[0], p[1], d), b = step(R, p[2], p[3], d);
    if (a.fell || b.fell) return null;
    p = [a.x, a.y, b.x, b.y];
  }
  return p;
}
const minCache = {};
function minSteps(lv) {
  if (!(lv.id in minCache)) { const s = solve(prep(lv.L), prep(lv.R)); minCache[lv.id] = s == null ? -1 : s.length; }
  return minCache[lv.id];
}
function validLevel(lv) {
  try {
    for (const b of [lv.L, lv.R]) {
      if (!(b.w >= 4 && b.w <= 7 && b.h >= 4 && b.h <= 7)) return false;
      if (!Array.isArray(b.rows) || b.rows.length !== b.h || b.rows.some(r => typeof r !== 'string' || r.length !== b.w)) return false;
      if (!Array.isArray(b.hw) || !Array.isArray(b.vw)) return false;
      if (!isFloor(b, b.s[0], b.s[1]) || !isFloor(b, b.g[0], b.g[1])) return false;
    }
    return true;
  } catch (e) { return false; }
}

/* ---------- 繪圖 ---------- */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const U = 100;
let gradN = 0; // 每個 svg 用自己的漸層 id（隱藏畫面裡的漸層無法被引用）
function addDefs(svg) {
  const defs = el('defs', {}, svg);
  const id = svg.dataset.gid || (svg.dataset.gid = 'bg' + (++gradN));
  const g = el('radialGradient', { id, cx: '35%', cy: '30%', r: '75%' }, defs);
  el('stop', { offset: '0', 'stop-color': '#fff' }, g);
  el('stop', { offset: '.55', 'stop-color': '#ffd9a0' }, g);
  el('stop', { offset: '1', 'stop-color': '#ff8a3d' }, g);
  return 'url(#' + id + ')';
}
function drawBoard(parent, b, side, ox, oy) {
  const g = el('g', { transform: `translate(${ox * U},${oy * U})` }, parent);
  const c1 = side === 'L' ? 'var(--tileL)' : 'var(--tileR)', c2 = side === 'L' ? 'var(--tileL2)' : 'var(--tileR2)';
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) if (isFloor(b, x, y)) {
    el('rect', { x: x * U + 3, y: y * U + 9, width: U - 6, height: U - 8, rx: 12, fill: c2 }, g);
    el('rect', { x: x * U + 3, y: y * U + 3, width: U - 6, height: U - 10, rx: 12, fill: c1 }, g);
  }
  el('circle', { cx: b.g[0] * U + 50, cy: b.g[1] * U + 48, r: 30, fill: 'none', stroke: '#fff', 'stroke-width': 7, class: 'goalring', opacity: .9 }, g);
  el('circle', { cx: b.g[0] * U + 50, cy: b.g[1] * U + 48, r: 10, fill: '#fff', opacity: .9 }, g);
  const H = b.H || new Set(b.hw), V = b.V || new Set(b.vw);
  const wl = { fill: 'var(--wall)', rx: 8, stroke: '#7a5a00', 'stroke-width': 2 };
  for (const k of H) { const [x, y] = k.split(',').map(Number);

    if (isFloor(b, x, y) || isFloor(b, x - 1, y)) el('rect', { x: x * U - 8, y: y * U + 6, width: 16, height: U - 12, ...wl }, g); }
  const ball = el('g', { class: 'ball nt' }, g);

// 把左右兩張圖畫進 svg（自動決定左右並排或上下排），回傳兩顆球的 <g>
function drawLevel(svg, lv) {

  let vw, vh, o;
  if (sH >= sV) { vw = L.w + R.w + G; vh = mh; o = [[0, (mh - L.h) / 2], [L.w + G, (mh - R.h) / 2]]; }
  else { vw = mw; vh = L.h + R.h + G; o = [[(mw - L.w) / 2, 0], [(mw - R.w) / 2, L.h + G]]; }
  svg.setAttribute('viewBox', `-20 -20 ${vw * U + 40} ${vh * U + 40}`);
  return [drawBoard(svg, L, 'L', o[0][0], o[0][1]), drawBoard(svg, R, 'R', o[1][0], o[1][1])];
}

const G = { lv: null, L: null, R: null, pos: null, moves: '', balls: null, dead: false, won: false, demo: null, test: false };
function enterPlay(lv, test) {

  $('plName').textContent = lv.name + (test ? '（試玩）' : '');

}
function setMoves(m) {

  const d = !!G.demo;

}
function saveProg() {

  store.set('prog', progs);
}
const atGoal = () => G.pos[0] === G.L.g[0] && G.pos[1] === G.L.g[1] && G.pos[2] === G.R.g[0] && G.pos[3] === G.R.g[1];
function doMove(d) {
  if (G.dead || G.won || overlayOn()) return false;
  const a = step(G.L, G.pos[0], G.pos[1], d), b = step(G.R, G.pos[2], G.pos[3], d);
  if (a.x === G.pos[0] && a.y === G.pos[1] && b.x === G.pos[2] && b.y === G.pos[3]) return false; // 兩邊都被牆擋住
  placeBall(G.balls[0], a.x, a.y, true); placeBall(G.balls[1], b.x, b.y, true);
  if (a.fell || b.fell) {
    G.dead = true;
    if (a.fell) G.balls[0].classList.add('fall');
    if (b.fell) G.balls[1].classList.add('fall');
    setTimeout(() => {
      if (!G.dead) return;
      overlay('掉下去了！', (a.fell && b.fell ? '兩顆球都' : a.fell ? '左邊的球' : '右邊的球') + '掉出地板了。',
        [['退回一步', () => setMoves(G.moves), true], ['重新開始', () => { setMoves(''); saveProg(); }]]);
    }, 450);
    return true;
  }
  G.pos = [a.x, a.y, b.x, b.y]; G.moves += d;
  if (atGoal()) { G.won = true; if (!G.demo) setTimeout(onWin, 350); }
  saveProg(); updateHud();

}
function onWin() {
  const lv = G.lv, n = G.moves.length, moves = G.moves;
  if (G.test) {
    overlay('過關！', `共 ${n} 步，這個關卡可以破關。`, [['回編輯器', () => { show('editor'); renderEditor(); }, true], ['再試一次', () => setMoves('')]]);
    return;
  }
  const old = recs[lv.id], isBest = !old || n < old.best.length;
  recs[lv.id] = { best: isBest ? moves : old.best, last: moves };
  store.set('rec', recs); saveProg();
  const ms = minSteps(lv), lvs = allLevels(), i = lvs.findIndex(l => l.id === lv.id);
  let msg = `你用了 <b>${n}</b> 步（最少 ${ms} 步）`;
  if (n === ms) msg += '<br>完美，這就是最短解！';
  else if (old && isBest) msg += '<br>刷新了自己的紀錄！';
  msg += '<br>解法已自動存檔，可隨時回播。';
  const btns = [];
  if (i < lvs.length - 1) btns.push(['下一關', () => { sel = i + 1; enterPlay(lvs[i + 1]); }, true]);
  btns.push(['回播', () => startDemo('', moves, '回播')], ['選關', () => { sel = i; goSelect(); }]);

}

/* 示範播放：回播紀錄或自動求解。prefix = 開始播放前已走的步，seq = 要播放的步 */
function startDemo(prefix, seq, label) {
  stopDemo(true);
  const resume = G.won ? '' : G.moves;
  setMoves(prefix);
  G.demo = { seq, i: 0, label, resume, prefix, timer: 0 };
  updateHud();
  const tick = () => {
    const D = G.demo; if (!D) return;
    if (D.i >= D.seq.length) {
      D.timer = setTimeout(() => {
        const again = [prefix, seq, label];
        const res = D.resume; G.demo = null; updateHud();
        overlay(label + '結束', `共 ${prefix.length + seq.length} 步。`, [
          ['再看一次', () => { setMoves(res); startDemo(...again); }],
          [res ? '回到我的進度' : '自己玩', () => setMoves(res), true],
          [G.test ? '回編輯器' : '選關', () => G.test ? (show('editor'), renderEditor()) : goSelect()]]);
      }, 500);
      return;
    }

}

  if (!s.length) return;

}

/* ---------- 關卡編輯器 ---------- */
const E = { id: null, tool: 'floor', L: null, R: null, paint: null };
const TIPS = { floor: '點或拖曳格子：加上／挖掉地板（可做成非矩形）', wall: '點格子的邊線：加上／拿掉牆', start: '點地板：放球的起點', goal: '點地板：放終點' };
function toEd(b) { // 關卡格式 -> 編輯用
  const cells = new Set();
  b.rows.forEach((r, y) => [...r].forEach((c, x) => { if (c === '#') cells.add(x + ',' + y); }));
  return { w: b.w, h: b.h, cells, H: new Set(b.hw), V: new Set(b.vw), s: b.s && [...b.s], g: b.g && [...b.g] };
}
function fromEd(e) { // 編輯用 -> 關卡格式（順便清掉沒貼著地板的牆）
  const has = (x, y) => e.cells.has(x + ',' + y), rows = [];
  for (let y = 0; y < e.h; y++) { let r = ''; for (let x = 0; x < e.w; x++) r += has(x, y) ? '#' : '.'; rows.push(r); }
  const hw = [...e.H].filter(k => { const [x, y] = k.split(',').map(Number); return has(x, y) || has(x, y - 1); }).sort();
  const vw = [...e.V].filter(k => { const [x, y] = k.split(',').map(Number); return has(x, y) || has(x - 1, y); }).sort();

}
function blankBoard(w, h) {

  show('editor'); renderEditor();
}
function edLevel() { return { id: '_ed', name: $('edName').value.trim() || '未命名關卡', L: fromEd(E.L), R: fromEd(E.R) }; }
function edProblem() {
  for (const [n, b] of [['左圖', E.L], ['右圖', E.R]]) {
    if (!b.s) return n + '還沒放球';
    if (!b.g) return n + '還沒放終點';

}
function renderEditor() {
  document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('sel', b.dataset.t === E.tool));
  $('edTip').textContent = TIPS[E.tool];
  document.querySelectorAll('.edSide').forEach(sd => {
    const side = sd.dataset.side, b = E[side], svg = sd.querySelector('svg');
    sd.querySelector('[data-o=w]').textContent = b.w; sd.querySelector('[data-o=h]').textContent = b.h;
    svg.textContent = ''; addDefs(svg);
    svg.setAttribute('viewBox', `-20 -20 ${b.w * U + 40} ${b.h * U + 40}`);
    const has = (x, y) => b.cells.has(x + ',' + y);
    const fill = side === 'L' ? 'var(--tileL)' : 'var(--tileR)';
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
      const f = has(x, y);
      el('rect', { x: x * U + 3, y: y * U + 3, width: U - 6, height: U - 6, rx: 12, fill: f ? fill : 'transparent',
        stroke: f ? 'none' : '#4a5580', 'stroke-width': 2, 'stroke-dasharray': f ? '' : '8 8', 'data-c': x + ',' + y }, svg);
    }
    if (b.g) { el('circle', { cx: b.g[0] * U + 50, cy: b.g[1] * U + 50, r: 30, fill: 'none', stroke: '#fff', 'stroke-width': 7, 'pointer-events': 'none' }, svg);
               el('circle', { cx: b.g[0] * U + 50, cy: b.g[1] * U + 50, r: 10, fill: '#fff', 'pointer-events': 'none' }, svg); }
    if (b.s) el('circle', { cx: b.s[0] * U + 50, cy: b.s[1] * U + 50, r: 26, fill: 'url(#' + svg.dataset.gid + ')', 'pointer-events': 'none', opacity: b.g && b.s[0] === b.g[0] && b.s[1] === b.g[1] ? .7 : 1 }, svg);
    const wallMode = E.tool === 'wall';
    const edge = (kind, x, y) => {
      const k = x + ',' + y, on = (kind === 'h' ? b.H : b.V).has(k);
      const adj = kind === 'h' ? (has(x, y) || has(x, y - 1)) : (has(x, y) || has(x - 1, y));
      if (!adj) return;
      const geo = (t, pad) => kind === 'h' ? { x: x * U + pad, y: y * U - t / 2, width: U - 2 * pad, height: t } : { x: x * U - t / 2, y: y * U + pad, width: t, height: U - 2 * pad };
      if (on) el('rect', { ...geo(16, 6), rx: 8, fill: 'var(--wall)', stroke: '#7a5a00', 'stroke-width': 2, 'pointer-events': 'none' }, svg);
      else if (wallMode) el('rect', { ...geo(6, 14), rx: 3, fill: '#fff', opacity: .28, 'pointer-events': 'none' }, svg);
      if (wallMode) el('rect', { ...geo(40, 10), fill: 'transparent', 'data-e': kind + k, style: 'cursor:pointer' }, svg);
    };
    for (let y = 0; y <= b.h; y++) for (let x = 0; x < b.w; x++) edge('h', x, y);
    for (let y = 0; y < b.h; y++) for (let x = 0; x <= b.w; x++) edge('v', x, y);
  });
  const p = edProblem(), st = $('edStatus');
  if (p) { st.innerHTML = `<span class="badc">⚠ ${p}</span>`; }
  else {
    const lv = edLevel(), s = solve(prep(lv.L), prep(lv.R));
    st.innerHTML = s == null ? '<span class="badc">✘ 目前無解：兩顆球沒辦法同時到終點</span>'
      : `<span class="okc">✔ 可解，最少 ${s.length} 步</span>`;
  }
}
function edApply(side, t) {
  const b = E[side];
  if (t.dataset.e) {
    const set = t.dataset.e[0] === 'h' ? b.H : b.V, k = t.dataset.e.slice(1);
    set.has(k) ? set.delete(k) : set.add(k);
    return true;
  }
  const c = t.dataset.c; if (!c) return false;
  const xy = c.split(',').map(Number), on = b.cells.has(c);
  if (E.tool === 'floor') {
    if (E.paint == null) E.paint = !on;
    if (E.paint === on) return false;
    if (E.paint) b.cells.add(c); else {
      b.cells.delete(c);
      if (b.s && b.s[0] === xy[0] && b.s[1] === xy[1]) b.s = null;
      if (b.g && b.g[0] === xy[0] && b.g[1] === xy[1]) b.g = null;
    }
    return true;
  }
  if (E.tool === 'start' || E.tool === 'goal') {
    if (!on) { toast('請點在地板上'); return false; }
    b[E.tool === 'start' ? 's' : 'g'] = xy; return true;
  }
  return false;
}
document.querySelectorAll('.edSide').forEach(sd => {
  const side = sd.dataset.side, box = sd.querySelector('.edSvg');
  let down = false;
  box.addEventListener('pointerdown', e => { down = true; E.paint = null; if (edApply(side, e.target)) renderEditor(); });
  box.addEventListener('pointermove', e => {
    if (!down || E.tool !== 'floor') return;
    const t = document.elementFromPoint(e.clientX, e.clientY);
    if (t && box.contains(t) && edApply(side, t)) renderEditor();
  });
  const up = () => { down = false; E.paint = null; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up); box.addEventListener('pointerleave', up);
  sd.querySelector('.edCtl').addEventListener('click', e => {
    const k = e.target.dataset.k; if (!k) return;
    const b = E[side], old = b[k], n = Math.max(4, Math.min(7, old + +e.target.dataset.v));
    if (n === old) { toast('長寬範圍是 4～7 格'); return; }
    b[k] = n;
    if (n > old) { // 新增的列/行預設鋪滿地板
      for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) if ((k === 'w' ? x : y) >= old) b.cells.add(x + ',' + y);
    } else {
      const inB = (x, y) => x < b.w && y < b.h;
      for (const c of [...b.cells]) { const [x, y] = c.split(',').map(Number); if (!inB(x, y)) b.cells.delete(c); }
      for (const c of [...b.H]) { const [x, y] = c.split(',').map(Number); if (x >= b.w || y > b.h) b.H.delete(c); }
      for (const c of [...b.V]) { const [x, y] = c.split(',').map(Number); if (x > b.w || y >= b.h) b.V.delete(c); }
      if (b.s && !inB(...b.s)) b.s = null;
      if (b.g && !inB(...b.g)) b.g = null;
    }
    renderEditor();
  });
});
$('tools').addEventListener('click', e => { if (e.target.dataset.t) { E.tool = e.target.dataset.t; renderEditor(); } });
$('edBack').onclick = () => overlay('離開編輯器', '尚未儲存的修改會消失。', [['繼續編輯', null, true], ['離開', goSelect]]);
$('edTest').onclick = () => {
  const p = edProblem(); if (p) { toast(p); return; }
  const lv = edLevel(); lv.id = '_test'; delete minCache._test; enterPlay(lv, true);
};
$('edSave').onclick = () => {
  const p = edProblem(); if (p) { toast(p); return; }
  const lv = edLevel();
  const doSave = () => {
    if (E.id) {
      const i = customs.findIndex(c => c.id === E.id);
      lv.id = E.id; customs[i] = lv;
      delete recs[lv.id]; delete progs[lv.id]; delete minCache[lv.id];   // 關卡改過，舊紀錄作廢
      store.set('rec', recs); store.set('prog', progs);
    } else { lv.id = 'c' + Date.now(); customs.push(lv); }
    store.set('custom', customs);
    sel = allLevels().findIndex(l => l.id === lv.id);
    goSelect(); toast('已儲存「' + lv.name + '」');
  };
  if (solve(prep(lv.L), prep(lv.R)) == null) overlay('這關目前無解', '還是要儲存嗎？之後可以再回來修改。', [['繼續編輯', null, true], ['仍要儲存', doSave]]);
  else doSave();
};

/* ---------- 啟動 ---------- */
(function init() {
  const last = store.get('sel', null), i = allLevels().findIndex(l => l.id === last);
  if (i >= 0) sel = i;
  show('select'); renderSelect();
})();
</script>
</body>
</html>
